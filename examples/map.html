<!doctype html>
<html lang="en" class="h-full overflow-hidden bg-[#e9e4d8] dark:bg-zinc-900">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Map · Duo true width</title>
<script>
  // ?narrow leaves the page beside Safari's control strip, for comparison
  window.SafeEdges = { enabled: !new URLSearchParams(location.search).has('narrow') };
</script>
<script src="../safe-edges.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body class="relative h-full font-sans antialiased text-ink dark:text-zinc-100">
<svg class="absolute inset-0 h-full w-full" viewBox="0 0 466 678" preserveAspectRatio="xMinYMin slice" aria-label="Map">
  <defs><pattern id="blocks" width="38" height="38" patternUnits="userSpaceOnUse"><rect width="38" height="38" fill="none" stroke="currentColor" stroke-opacity=".08"/></pattern></defs>
  <g id="world" style="transform-origin: 233px 300px; transition: transform .25s">
    <rect x="-400" y="-400" width="1300" height="1500" fill="url(#blocks)"/>
    <path d="M-100 520 C 80 470, 160 600, 330 520 S 520 420, 700 470 L 700 900 L -100 900 Z" fill="oklch(0.78 0.07 230)"/>
    <path d="M40 -50 L 120 760" stroke="white" stroke-width="14"/>
    <path d="M-50 210 L 560 160" stroke="white" stroke-width="14"/>
    <path d="M-50 380 C 150 330, 300 420, 560 330" stroke="var(--color-byrne-yellow)" stroke-width="10" fill="none"/>
    <path d="M300 -50 L 420 760" stroke="white" stroke-width="10"/>
    <rect x="150" y="230" width="110" height="80" rx="6" fill="oklch(0.8 0.1 145)"/>
    <text x="205" y="275" text-anchor="middle" font-size="11" fill="oklch(0.35 0.08 145)">Park</text>
    <circle cx="420" cy="140" r="9" fill="var(--color-byrne-red)" stroke="white" stroke-width="3"/>
  </g>
</svg>
<div class="absolute inset-x-safe-3 top-safe-3 flex items-center gap-2 rounded-full bg-white/85 px-3 py-2 shadow-sm ring-1 ring-black/5 backdrop-blur-md dark:bg-zinc-800/85 dark:ring-white/10">
  <svg class="size-4 text-black/50 dark:text-white/50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span class="flex-1 text-sm text-black/50 dark:text-white/50">Search places</span><a data-width-toggle class="rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-wider ring-1 text-byrne-blue ring-byrne-blue/30 dark:text-sky-300 dark:ring-sky-300/30"></a>
</div>
<a href="index.html" class="absolute left-safe-3 bottom-safe-4 rounded-full bg-white/85 px-3 py-1.5 text-sm font-medium shadow-sm backdrop-blur-md dark:bg-zinc-800/85">← Examples</a>
<nav class="strip-rail z-20" aria-label="Map controls">
  <button class="strip-button" aria-label="Zoom in" onclick="zoom(1.25)"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="strip-button" aria-label="Zoom out" onclick="zoom(0.8)"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
</nav>
<nav class="hidden no-strip:flex absolute right-safe-3 top-[calc(env(safe-area-inset-top)+4.5rem)] z-20 flex-col gap-3" aria-label="Map controls">
  <button class="rail-button" aria-label="Zoom in" onclick="zoom(1.25)"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="rail-button" aria-label="Zoom out" onclick="zoom(0.8)"><svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
</nav>
<script>
let scale = 1;
function zoom(f) { scale = f ? Math.min(4, Math.max(0.5, scale * f)) : 1; world.style.transform = `scale(${scale})`; }
</script>
<script src="toggle.js"></script>
</body>
</html>
